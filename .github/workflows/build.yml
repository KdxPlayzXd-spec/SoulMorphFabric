name: Build Soul Morph Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract mod ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Find project and build
        run: |
          PROJECT_DIR=$(find extracted -name build.gradle -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find build.gradle inside ZIP"
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --version
          gradle build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: SoulMorphFabric-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
